<p class="auto-style1">個人介紹</p>
<p class="auto-style2">大家好，我是劉宣之，可以叫我莫妮卡或康阿吉。目前就讀多媒體設計系。<br />
平時對創作與表達類型的事物特別有興趣，像是舞蹈、影像或設計相關內容，也喜歡透過不同形式記錄想法與情緒。</p>
<p class="auto-style2">在學習過程中，我希望自己不只是完成要求，而是能理解背後的意義，並嘗試把學到的東西實際應用出來。<br />
未來也期許自己能持續累積經驗，在探索興趣的同時，慢慢找到適合自己的方向。</p>
